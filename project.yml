name: MementoFM

settings:
  IPHONEOS_DEPLOYMENT_TARGET: "26.0"
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: 1
  PRODUCT_BUNDLE_IDENTIFIER: com.icecoffin.mementofm
  ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

fileGroups:
  - .periphery.yml
  - .swiftlint.yml
  - project.yml
  - README.md
  - Sources
  - Tests
  - Resources
  - Supporting Files

schemes:
  MementoFMTests:
    build:
      targets:
        MementoFM: test
        MementoFMTests: test
    test:
      targets:
        - MementoFMTests

targets:
  MementoFM:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Application/Keys.example.swift"
      - Resources
    scheme:
        testTargets:
          - MementoFMTests
    dependencies:
      - package: Alamofire
      - package: CombineSchedulers
      - package: Realm
        product: RealmSwift
      - package: SnapKit
    info:
      path: "Supporting Files/Info.plist"
      properties:
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
            UIApplicationSupportsMultipleScenes: false
            UISceneConfigurations:
                UIWindowSceneSessionRoleApplication: [
                    {
                        UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate",
                        UISceneConfigurationName: "Default Configuration"
                    }
                ]
    preBuildScripts:
      - name: Run SwiftLint
        script: |
           export PATH="$HOME/.local/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"

           if command -v mise >/dev/null 2>&1; then
             mise exec -- swiftlint
           else
             echo "warning: mise not found; skipping SwiftLint"
           fi
        basedOnDependencyAnalysis: false

  MementoFMTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - "**/__Snapshots__"
    dependencies:
      - target: MementoFM
      - package: Realm
        product: RealmSwift
      - package: SnapshotTesting

aggregateTargets:
  Periphery:
    buildScripts:
      - script: |
          /opt/homebrew/bin/periphery scan --format xcode

packages:
  Alamofire:
    url: https://github.com/Alamofire/Alamofire
    exactVersion: 5.12.0
  CombineSchedulers:
    url: https://github.com/pointfreeco/combine-schedulers
    exactVersion: 1.2.0
  Realm:
    url: https://github.com/realm/realm-swift
    exactVersion: 20.0.5
  SnapKit:
    url: https://github.com/SnapKit/SnapKit
    exactVersion: 6.0.0
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.2
